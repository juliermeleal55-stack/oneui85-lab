name: Build Star7ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TARGET_FIRMWARE_ID: ${{ secrets.TARGET_FIRMWARE_ID }}
    strategy:
      fail-fast: false
      matrix:
        target: [beyond2lte]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Validate target firmware identifier
        shell: bash
        run: |
          if [ -z "$TARGET_FIRMWARE_ID" ]; then
            echo "::error::Missing GitHub Actions secret TARGET_FIRMWARE_ID."
            echo "Set it to an 8-15 digit IMEI/TAC value or an 11-character Samsung serial starting with R."
            exit 1
          fi

          if [[ "$TARGET_FIRMWARE_ID" =~ ^[0-9]{8,15}$ ]]; then
            exit 0
          fi

          if [[ "$TARGET_FIRMWARE_ID" =~ ^R[A-Za-z0-9]{10}$ ]]; then
            exit 0
          fi

          echo "::error::TARGET_FIRMWARE_ID has an invalid format."
          exit 1

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/extremerom_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/extremerom_platform.x509.pem

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Validate beyond2lte target contract
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/check_target_contract.sh "$TARGET_CODENAME"

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-target

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-target

      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-source

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-source

      - name: Create Swap Space
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          # Print swap status to the action log to verify it worked
          sudo swapon --show

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: ZIP file not found"
            exit 1
          fi
          ZIP_NAME=$(basename "$ZIP_FILE")
          ZIP_SHA256=$(sha256sum "$ZIP_FILE" | cut -d' ' -f1)
          echo "zip_path=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Split ZIP into chunks (if >1.5GB)
        id: split_zip
        run: |
          ZIP_PATH="${{ steps.find_zip.outputs.zip_path }}"
          ZIP_SIZE=$(stat -c%s "$ZIP_PATH")
          ZIP_DIR=$(dirname "$ZIP_PATH")
          ZIP_NAME=$(basename "$ZIP_PATH")

          if [ "$ZIP_SIZE" -gt 1500000000 ]; then
            ORIGINAL_DIR=$(pwd)
            cd "$ZIP_DIR"
            split -b 1500m "$ZIP_NAME" "$ZIP_NAME.part."

            echo "split_files<<EOF" >> "$GITHUB_OUTPUT"
            for f in "${ZIP_NAME}.part."*; do
              echo "$ORIGINAL_DIR/$ZIP_DIR/$f" >> "$GITHUB_OUTPUT"
            done
            echo "EOF" >> "$GITHUB_OUTPUT"

            FILE_LIST=$(ls "${ZIP_NAME}.part."* | tr '\n' ' ')
            echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
            echo "is_split=true" >> "$GITHUB_OUTPUT"
            cd "$ORIGINAL_DIR"
          else
            echo "split_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$ZIP_PATH" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "is_split=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}-${{ matrix.target }}
          name: Star7ROM ${{ matrix.target }} - ${{ github.event.repository.updated_at }}
          files: ${{ steps.split_zip.outputs.split_files }}
          body: |
            Built from workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            Target: ${{ matrix.target }}
            Build environment: Ubuntu 24.04, JDK 21 and CCache
            Signed with configured platform keys.

            ## File information
            ${{ steps.split_zip.outputs.is_split == 'true' && 'Split ZIP parts' || 'Single ZIP file' }}
            ${{ steps.split_zip.outputs.is_split == 'true' && format('Parts: {0}', steps.split_zip.outputs.file_list) || format('File: {0}', steps.find_zip.outputs.zip_name) }}

            ## SHA-256
            `${{ steps.find_zip.outputs.zip_sha256 }}`

            ${{ steps.split_zip.outputs.is_split == 'true' && '## Merge instructions' || '' }}
            ${{ steps.split_zip.outputs.is_split == 'true' && format('```bash\n            cat {0}.part.* > {0}\n            sha256sum {0}\n            ```', steps.find_zip.outputs.zip_name) || '' }}

            Verify the checksum before flashing.
